# quadratic-exact-lab · Android 构建配置
#
# 本机工具链都在 D 盘（C 盘几乎满了，任何新文件都不能落 C 盘）：
#   JDK    : D:\mcforge\java\temurin17-jdk
#   Gradle : D:\android-toolchain\gradle\gradle-8.9
#   SDK    : D:\android-toolchain\sdk
#   GRADLE_USER_HOME : D:\android-toolchain\gradle\home

org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# 关闭「每次构建都检查更新」，离线/内网构建更稳
android.suppressUnsupportedCompileSdk=35
