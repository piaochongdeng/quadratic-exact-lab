# 开启 BBR 拥塞控制。
#
# 这台机器在首尔，从国内访问是高延迟跨境链路。内核默认的 cubic 在这种
# 链路上丢一点包就把窗口砍半，实测下载安装包只有 60 KB/s 左右。
# 换成 BBR 后实测中位数约 2.5 MB/s —— 同一个 90MB 的安装包，
# 从 25 分钟缩到 40 秒左右。
#
# qdisc 用 fq：这是 BBR 官方推荐的搭配。系统自带的
# /etc/sysctl.d/10-bufferbloat.conf 把默认 qdisc 设成了 fq_codel，
# 本身没问题，但配 BBR 要用 fq。
# 文件名用 99- 开头，是为了排在 10-bufferbloat.conf 之后生效
# （systemd-sysctl 按文件名字典序依次应用，后面的覆盖前面的）。
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
